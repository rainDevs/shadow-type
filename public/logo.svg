<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Shadow Type logo: crossed daggers over a keycap">
  <defs>
    <linearGradient id="st-blade-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0feffb"/>
      <stop offset="1" stop-color="#0696db"/>
    </linearGradient>
    <linearGradient id="st-blade-ember" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fda216"/>
      <stop offset="1" stop-color="#fc5003"/>
    </linearGradient>
    <filter id="st-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ember dagger, top-right to bottom-left (behind) -->
  <g filter="url(#st-glow)">
    <polygon points="98,22 55.5,71.5 48.5,64.5" fill="url(#st-blade-ember)"/>
    <line x1="90" y1="30" x2="58" y2="62" stroke="#fcfefe" stroke-width="2" opacity="0.85"/>
    <polygon points="48,64 60,76 56,80 44,68" fill="#fda216"/>
    <polygon points="50,70 56,76 46,88 40,82" fill="#5e2c29"/>
    <circle cx="43" cy="85" r="4" fill="#f489f6"/>
    <!-- cyan dagger, top-left to bottom-right (front) -->
    <polygon points="30,22 79.5,64.5 72.5,71.5" fill="url(#st-blade-cyan)"/>
    <line x1="38" y1="30" x2="70" y2="62" stroke="#fcfefe" stroke-width="2" opacity="0.85"/>
    <polygon points="80,64 68,76 72,80 84,68" fill="#0feffb"/>
    <polygon points="78,70 72,76 82,88 88,82" fill="#03396b"/>
    <circle cx="85" cy="85" r="4" fill="#f489f6"/>
  </g>

  <!-- keycap, center foreground -->
  <g filter="url(#st-glow)">
    <rect x="46" y="48" width="44" height="40" rx="7" fill="#000000" opacity="0.55"/>
    <rect x="42" y="44" width="44" height="40" rx="7" fill="#fcfefe" stroke="#94a0ba" stroke-width="3"/>
    <!-- pixel "T" key legend -->
    <rect x="54" y="54" width="20" height="6" fill="#d840fb"/>
    <rect x="61" y="54" width="6" height="18" fill="#d840fb"/>
  </g>

  <!-- spark pixels -->
  <rect x="16" y="50" width="4" height="4" fill="#0feffb"/>
  <rect x="108" y="48" width="4" height="4" fill="#fda216"/>
  <rect x="98" y="102" width="5" height="5" fill="#f489f6"/>
  <rect x="22" y="98" width="4" height="4" fill="#94a0ba"/>
</svg>
