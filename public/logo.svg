<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144" role="img" aria-label="Shadow Type crest: a dagger stabbed into S and T keycaps">
  <defs>
    <linearGradient id="st-shield-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f489f6"/>
      <stop offset="1" stop-color="#d840fb"/>
    </linearGradient>
    <linearGradient id="st-shield-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0feffb"/>
      <stop offset="1" stop-color="#0696db"/>
    </linearGradient>
    <linearGradient id="st-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a0ba"/>
      <stop offset="0.5" stop-color="#fcfefe"/>
      <stop offset="1" stop-color="#94a0ba"/>
    </linearGradient>
    <path id="st-shield" d="M64 4 L116 18 L116 74 L108 74 L108 90 L96 90 L96 104 L80 104 L80 116 L64 128 L48 116 L48 104 L32 104 L32 90 L20 90 L20 74 L12 74 L12 18 Z"/>
    <clipPath id="st-shield-clip">
      <use href="#st-shield"/>
    </clipPath>
    <filter id="st-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- split shield -->
  <g filter="url(#st-glow)">
    <use href="#st-shield" fill="url(#st-shield-left)"/>
    <g clip-path="url(#st-shield-clip)">
      <rect x="64" y="0" width="64" height="144" fill="url(#st-shield-right)"/>
    </g>
    <use href="#st-shield" fill="none" stroke="#04193f" stroke-width="6" stroke-linejoin="miter"/>
    <use href="#st-shield" fill="none" stroke="#fcfefe" stroke-width="2" stroke-linejoin="miter" opacity="0.35" transform="translate(64 66) scale(0.9) translate(-64 -66)"/>
  </g>

  <!-- ST keycaps -->
  <g filter="url(#st-glow)">
    <polygon points="42,56 62,56 68,62 68,90 62,96 42,96 36,90 36,62" fill="#000000" opacity="0.5"/>
    <polygon points="74,56 94,56 100,62 100,90 94,96 74,96 68,90 68,62" fill="#000000" opacity="0.5"/>
    <polygon points="38,52 58,52 64,58 64,88 58,94 38,94 32,88 32,58" fill="#fcfefe" stroke="#04193f" stroke-width="4" stroke-linejoin="miter"/>
    <polygon points="70,52 90,52 96,58 96,88 90,94 70,94 64,88 64,58" fill="#fcfefe" stroke="#04193f" stroke-width="4" stroke-linejoin="miter"/>
    <!-- pixel S -->
    <g fill="#d840fb">
      <rect x="42" y="64" width="10" height="3"/>
      <rect x="42" y="67" width="3" height="3"/>
      <rect x="42" y="70" width="3" height="3"/>
      <rect x="42" y="72" width="10" height="3"/>
      <rect x="49" y="75" width="3" height="3"/>
      <rect x="49" y="78" width="3" height="3"/>
      <rect x="42" y="80" width="10" height="3"/>
    </g>
    <!-- pixel T -->
    <g fill="#0696db">
      <rect x="76" y="64" width="10" height="3"/>
      <rect x="79.5" y="67" width="3" height="3"/>
      <rect x="79.5" y="70" width="3" height="3"/>
      <rect x="79.5" y="73" width="3" height="3"/>
      <rect x="79.5" y="76" width="3" height="3"/>
      <rect x="79.5" y="79" width="3" height="3"/>
      <rect x="79.5" y="81" width="3" height="2"/>
    </g>
  </g>

  <!-- dagger stabbed into the T keycap -->
  <g filter="url(#st-glow)">
    <circle cx="83" cy="12" r="4.5" fill="#f489f6"/>
    <rect x="79" y="16" width="8" height="20" fill="url(#st-steel)"/>
    <rect x="79" y="16" width="2" height="20" fill="#04193f" opacity="0.35"/>
    <polygon points="68,36 98,36 98,42 68,42" fill="#fda216"/>
    <polygon points="72,32 76,32 76,36 72,36" fill="#fda216"/>
    <polygon points="90,32 94,32 94,36 90,36" fill="#fda216"/>
    <polygon points="77,42 89,42 85,66 81,66" fill="url(#st-steel)"/>
    <line x1="83" y1="44" x2="83" y2="62" stroke="#fcfefe" stroke-width="1.5" opacity="0.9"/>
    <!-- impact sparks on the cap -->
    <rect x="94" y="50" width="4" height="4" fill="#fcfefe"/>
    <rect x="70" y="48" width="3" height="3" fill="#fcfefe" opacity="0.8"/>
  </g>

  <!-- outer spark pixels -->
  <rect x="6" y="40" width="4" height="4" fill="#0feffb"/>
  <rect x="118" y="36" width="4" height="4" fill="#fda216"/>
  <rect x="112" y="106" width="5" height="5" fill="#f489f6"/>
  <rect x="10" y="100" width="4" height="4" fill="#94a0ba"/>
</svg>