<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144" role="img" aria-label="Shadow Type logo: dagger stabbed into S and T keycaps on a split crest">
  <defs>
    <linearGradient id="st-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfefe"/>
      <stop offset="1" stop-color="#94a0ba"/>
    </linearGradient>
    <filter id="st-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- split pixel crest -->
  <g filter="url(#st-glow)">
    <path d="M28,28 H100 V80 C100,110 84,126 64,136 C44,126 28,110 28,80 Z" fill="#f489f6"/>
    <path d="M64,28 H100 V80 C100,110 84,126 64,136 Z" fill="#0696db"/>
    <path d="M28,28 H100 V80 C100,110 84,126 64,136 C44,126 28,110 28,80 Z" fill="none" stroke="#000000" stroke-width="4" opacity="0.55"/>
    <path d="M33,33 H95 V79 C95,105 82,119 64,128 C46,119 33,105 33,79 Z" fill="none" stroke="#fcfefe" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- S + T keycaps the dagger is stabbed into -->
  <g filter="url(#st-glow)">
    <polygon points="44,74 61,74 66,79 66,99 61,104 44,104 39,99 39,79" fill="#000000" opacity="0.55"/>
    <polygon points="75,74 92,74 97,79 97,99 92,104 75,104 70,99 70,79" fill="#000000" opacity="0.55"/>
    <polygon points="40,70 57,70 62,75 62,95 57,100 40,100 35,95 35,75" fill="#fcfefe" stroke="#94a0ba" stroke-width="3" stroke-linejoin="miter"/>
    <polygon points="71,70 88,70 93,75 93,95 88,100 71,100 66,95 66,75" fill="#fcfefe" stroke="#94a0ba" stroke-width="3" stroke-linejoin="miter"/>
    <!-- pixel "S" -->
    <g fill="#d840fb">
      <rect x="43" y="78" width="10" height="2"/>
      <rect x="43" y="80" width="2" height="2"/>
      <rect x="43" y="82" width="2" height="2"/>
      <rect x="43" y="84" width="10" height="2"/>
      <rect x="51" y="86" width="2" height="2"/>
      <rect x="51" y="88" width="2" height="2"/>
      <rect x="43" y="90" width="10" height="2"/>
    </g>
    <!-- pixel "T" -->
    <g fill="#0696db">
      <rect x="74" y="78" width="10" height="2"/>
      <rect x="78" y="80" width="2" height="2"/>
      <rect x="78" y="82" width="2" height="2"/>
      <rect x="78" y="84" width="2" height="2"/>
      <rect x="78" y="86" width="2" height="2"/>
      <rect x="78" y="88" width="2" height="2"/>
      <rect x="78" y="90" width="2" height="2"/>
    </g>
  </g>

  <!-- stabbed dagger: tip buried between the keys, hilt skyward -->
  <g filter="url(#st-glow)">
    <polygon points="64,98 59,50 69,50" fill="url(#st-blade)"/>
    <line x1="64" y1="90" x2="64" y2="56" stroke="#0feffb" stroke-width="2" opacity="0.9"/>
    <polygon points="50,44 78,44 78,50 50,50" fill="#fda216"/>
    <rect x="50" y="48" width="28" height="2" fill="#fc5003"/>
    <rect x="60" y="26" width="8" height="18" fill="#780bf7"/>
    <line x1="60" y1="31" x2="68" y2="31" stroke="#04193f" stroke-width="2"/>
    <line x1="60" y1="36" x2="68" y2="36" stroke="#04193f" stroke-width="2"/>
    <line x1="60" y1="41" x2="68" y2="41" stroke="#04193f" stroke-width="2"/>
    <circle cx="64" cy="21" r="5" fill="#f489f6"/>
  </g>

  <!-- spark pixels -->
  <rect x="14" y="82" width="4" height="4" fill="#0feffb"/>
  <rect x="110" y="82" width="4" height="4" fill="#fda216"/>
  <rect x="28" y="112" width="4" height="4" fill="#f489f6"/>
  <rect x="96" y="112" width="4" height="4" fill="#fcfefe"/>
</svg>
