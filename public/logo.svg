<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Shadow Type logo: S and T pixel keycaps">
  <defs>
    <filter id="st-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- plain pixeled keycaps with cut corners -->
  <g filter="url(#st-glow)">
    <polygon points="38,50 59,50 65,56 65,84 59,92 38,92 32,84 32,56" fill="#000000" opacity="0.55"/>
    <polygon points="77,50 98,50 104,56 104,84 98,92 77,92 71,84 71,56" fill="#000000" opacity="0.55"/>
    <polygon points="34,46 55,46 61,52 61,82 55,88 34,88 28,82 28,52" fill="#fcfefe" stroke="#94a0ba" stroke-width="3" stroke-linejoin="miter"/>
    <polygon points="73,46 94,46 100,52 100,82 94,88 73,88 67,82 67,52" fill="#fcfefe" stroke="#94a0ba" stroke-width="3" stroke-linejoin="miter"/>
    <!-- keycap top highlight -->
    <polygon points="34,46 55,46 61,52 59,54 53,54 53,50 36,50 36,54 30,54" fill="#ffffff" opacity="0.7"/>
    <polygon points="73,46 94,46 100,52 98,54 92,54 92,50 75,50 75,54 69,54" fill="#ffffff" opacity="0.7"/>
    <!-- pixel "S" -->
    <g fill="#d840fb">
      <rect x="39" y="60" width="10" height="2"/>
      <rect x="39" y="62" width="2" height="2"/>
      <rect x="39" y="64" width="2" height="2"/>
      <rect x="39" y="66" width="10" height="2"/>
      <rect x="47" y="68" width="2" height="2"/>
      <rect x="47" y="70" width="2" height="2"/>
      <rect x="39" y="72" width="10" height="2"/>
    </g>
    <!-- pixel "T" -->
    <g fill="#0696db">
      <rect x="78" y="60" width="10" height="2"/>
      <rect x="82" y="62" width="2" height="2"/>
      <rect x="82" y="64" width="2" height="2"/>
      <rect x="82" y="66" width="2" height="2"/>
      <rect x="82" y="68" width="2" height="2"/>
      <rect x="82" y="70" width="2" height="2"/>
      <rect x="82" y="72" width="2" height="2"/>
    </g>
  </g>

  <!-- spark pixels -->
  <rect x="14" y="60" width="4" height="4" fill="#0feffb"/>
  <rect x="110" y="60" width="4" height="4" fill="#fda216"/>
  <rect x="62" y="104" width="5" height="5" fill="#f489f6"/>
  <rect x="60" y="20" width="4" height="4" fill="#94a0ba"/>
</svg>
